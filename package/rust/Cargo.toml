[package]
name = "pi-agent-loop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "面向验证的最小 agent loop：显式状态转换与异步执行层"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[dev-dependencies]
dotenvy = "=0.15.7"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
